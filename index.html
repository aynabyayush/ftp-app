<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FTPApp — High Performance Android FTP Client & Server</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#02040A',
              navy: '#040914',
              surface: '#0B162C',
              cyan: '#00F0FF',
              cyanDim: '#00E5FF',
              purple: '#9D00FF',
              magenta: '#FF007F'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #02040A;
      color: #E2E8F0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    .cyber-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
    }

    .cyber-glow-cyan {
      box-shadow: 0 0 25px -5px rgba(0, 240, 255, 0.35);
    }

    .cyber-glow-purple {
      box-shadow: 0 0 35px -5px rgba(157, 0, 255, 0.35);
    }

    .glass-card {
      background: rgba(11, 22, 44, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      border-color: rgba(0, 240, 255, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -10px rgba(0, 240, 255, 0.2);
    }

    .glass-card-interactive {
      background: rgba(11, 22, 44, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    .text-gradient {
      background: linear-gradient(135deg, #00F0FF 0%, #A8C7FA 50%, #9D00FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
